name: Convert uploaded HEIC
on:
  push:
    paths: ['.github/workflows/convert-heic-artifact.yml']
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow pillow-heif
      - run: |
          mkdir -p converted
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import pillow_heif
          pillow_heif.register_heif_opener()
          with Image.open("photos/IMG_9697.HEIC") as original:
              image = ImageOps.exif_transpose(original).convert("RGB")
              image.thumbnail((2400, 2400))
              image.save("converted/IMG_9697.jpg", quality=92)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: converted-photograph
          path: converted/IMG_9697.jpg
          retention-days: 1
